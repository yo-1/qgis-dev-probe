name: QGIS repository preflight
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static scanners
        run: python -m pip install bandit==1.9.4 flake8
      - name: Build submission ZIP
        run: python scripts/package_plugin.py
      - name: Check exact distribution ZIP
        run: python scripts/qgis_preflight.py dist/qgis_dev_probe-*.zip --json-out dist/qgis-preflight.json
      - name: Flake8 (report)
        if: success() || failure()
        run: flake8 plugin/qgis_dev_probe --count --statistics --exit-zero > dist/flake8.txt
      - name: Bandit (report and fail on findings)
        if: success() || failure()
        run: |
          bandit -r plugin/qgis_dev_probe -f json -o dist/bandit.json || {
            echo 'Bandit reported findings; preflight remains blocked.'
            exit 1
          }
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-repository-preflight
          path: |
            dist/*.zip
            dist/*.json
            dist/flake8.txt
          if-no-files-found: warn
