[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qgis-dev-probe"
version = "0.1.2"
description = "Development-time MCP server and QGIS plugin to observe and drive QGIS (GUI, Processing) from AI clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yo-1" }]
# mcp 2.x では FastMCP が MCPServer に改名されている。1.x とは互換性がないため上限を固定する。
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
# 任意: 実 Qt（オフスクリーン）で widgets のテストを行う場合のみ
qt = ["PyQt5>=5.15"]

[project.scripts]
qgis-dev-probe-mcp = "qgis_dev_probe_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_dev_probe_mcp"]

[tool.ruff]
line-length = 100
# QGIS 同梱 Python の下限が環境により異なるため、プラグイン側は 3.9 互換で書く。
target-version = "py39"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105"]  # try/except/pass は「失敗しても継続」の意図を明示するため許容

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["qgis_dev_probe", "qgis_dev_probe_mcp", "tests"]
